[package]
name = "jelly-voice-notes"
version = "0.1.0"
description = "Dictation, meeting notes and pre-meeting notes on your own API keys"
edition = "2021"
default-run = "jelly-voice-notes"

[lib]
name = "jelly_voice_notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
dirs = "5"
chrono = "0.4"
tokio = { version = "1.53.1", features = ["macros", "rt", "rt-multi-thread", "time", "sync"] }
futures = "0.3.34"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
reqwest = { version = "0.13.4", features = ["json", "multipart"] }
# The microphone on every system, and what the speakers play on Windows.
cpal = "0.15"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-global-shortcut = "2.3.2"

# macOS: the system audio tap, typing into the focused app, and which app
# and window are in front (for meeting detection).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", features = ["exception"] }
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-core-graphics = "0.3"
objc2-core-foundation = "0.3"
objc2-core-audio = { version = "0.3.2", features = ["AudioHardware", "objc2", "block2", "dispatch2", "objc2-core-audio-types", "objc2-foundation"] }
objc2-core-audio-types = "0.3.2"
block2 = "0.6"

# Windows: typing into the focused app and which window is in front.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_ProcessStatus"] }
